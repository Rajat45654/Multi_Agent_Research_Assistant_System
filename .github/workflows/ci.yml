name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality:
    name: Syntax & Code Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python Syntax
        run: |
          python -m compileall src/ scripts/ tests/

  unit-tests:
    name: Multi-Agent Unit & Exporter Tests
    runs-on: ubuntu-latest
    needs: code-quality
    env:
      LLM_BACKEND: "gemini"
      PORT: "8080"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic

      - name: Run Multi-Hop Query Decomposition Tests
        run: |
          python -m unittest tests/test_multi_hop.py -v

      - name: Run Academic Exporter (BibTeX & Markdown) Tests
        run: |
          python -m unittest tests/test_exporter.py -v

  docker-build:
    name: Docker Container Validation
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: research-assistant:ci-test
